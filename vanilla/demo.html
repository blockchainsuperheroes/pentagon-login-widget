<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentagon Login Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f; color: #e0e0e8;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        .demo {
            text-align: center; max-width: 400px; padding: 40px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #8888a0; margin-bottom: 24px; }
        button {
            padding: 14px 32px; border-radius: 8px; border: none;
            background: #7c5cff; color: white; font-size: 16px;
            font-weight: 600; cursor: pointer;
        }
        button:hover { background: #6a4de0; }
        .user-info {
            margin-top: 24px; padding: 20px; background: #12121a;
            border: 1px solid #2a2a3a; border-radius: 12px; text-align: left;
        }
        .user-info h3 { margin: 0 0 12px; }
        .user-info p { margin: 4px 0; font-size: 14px; }
        .logout { margin-top: 16px; background: #333; font-size: 14px; padding: 8px 20px; }
    </style>
</head>
<body>
    <div class="demo">
        <h1>⛊ Your App</h1>
        <p>Demo: Pentagon Games in-app login (no redirect)</p>

        <div id="logged-out">
            <button onclick="login()">Sign In with Pentagon</button>
        </div>

        <div id="logged-in" style="display:none;">
            <div class="user-info">
                <h3>✅ Logged in</h3>
                <p><strong>Username:</strong> <span id="user-name">-</span></p>
                <p><strong>Email:</strong> <span id="user-email">-</span></p>
                <p><strong>Wallet:</strong> <span id="user-wallet">-</span></p>
            </div>
            <button class="logout" onclick="logout()">Sign Out</button>
        </div>
    </div>

    <script src="pentagon-login.js"></script>
    <script>
        // Set your app key here
        window.PG_APP_KEY = 'pk_live_your_key_here';

        function login() {
            showPentagonLogin(async (result) => {
                localStorage.setItem('pg_token', result.access_token);
                localStorage.setItem('pg_refresh', result.refresh_token);
                await loadUser();
            });
        }

        async function loadUser() {
            const token = localStorage.getItem('pg_token');
            if (!token) return;
            try {
                const res = await fetch('https://api.account.pentagon.games/user/info', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.result) {
                    document.getElementById('user-name').textContent = data.result.username || '-';
                    document.getElementById('user-email').textContent = data.result.email || '-';
                    document.getElementById('user-wallet').textContent = data.result.mm_address
                        ? `${data.result.mm_address.slice(0,6)}...${data.result.mm_address.slice(-4)}`
                        : 'Not connected';
                    document.getElementById('logged-out').style.display = 'none';
                    document.getElementById('logged-in').style.display = 'block';
                }
            } catch (e) { console.error('Failed to load user:', e); }
        }

        function logout() {
            localStorage.removeItem('pg_token');
            localStorage.removeItem('pg_refresh');
            document.getElementById('logged-out').style.display = 'block';
            document.getElementById('logged-in').style.display = 'none';
        }

        // Check for existing session on load
        if (localStorage.getItem('pg_token')) loadUser();
    </script>
</body>
</html>
